# cargo-deny configuration (run by .github/workflows/nightly.yml).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser (through fontdue) is unmaintained. The renderer only parses its own
    # embedded font, never user input; moving the glyph pipeline off fontdue is
    # tracked in https://github.com/TNYCL/dotloom/issues/16.
    { id = "RUSTSEC-2026-0192", reason = "parses only the embedded, trusted font; migration tracked in #16" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses compatible with distributing Dotloom under MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "Unlicense",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
