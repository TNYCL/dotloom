[workspace]
resolver = "3"
members = [
    "crates/geometry",

]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["TNYCL <tunaycl@outlook.com>"]
repository = "https://github.com/TNYCL/dotloom"
homepage = "https://tnycl.github.io/dotloom/"
documentation = "https://docs.rs/dotloom"
keywords = ["cad", "constraints", "geometry", "editor", "wasm"]
categories = ["graphics", "mathematics", "wasm"]
readme = "README.md"

[workspace.dependencies]
dotloom-geometry = { path = "crates/geometry", version = "0.1.0" }
dotloom-document = { path = "crates/document", version = "0.1.0" }
dotloom-constraints = { path = "crates/constraints", version = "0.1.0" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
robust = "1.2.0"
rstar = "0.13.0"
kasuari = "0.4.12"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
proptest = "1.11.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
float_cmp = "allow"

[profile.release]
codegen-units = 4
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
