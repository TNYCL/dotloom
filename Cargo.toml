[workspace]
resolver = "3"
members = [
    "crates/geometry",
    "crates/constraints",
    "crates/document",
    "crates/scene",
    "crates/engine",
    "crates/io",
    "crates/cli",
    "crates/wasm",
    "crates/render",
    "crates/render-web",
]
# cargo-fuzz targets need nightly and live in their own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["TNYCL <tunaycl@outlook.com>"]
repository = "https://github.com/TNYCL/dotloom"
homepage = "https://tnycl.github.io/dotloom/"
documentation = "https://docs.rs/dotloom"
keywords = ["cad", "constraints", "geometry", "editor", "wasm"]
categories = ["graphics", "mathematics", "wasm"]
readme = "README.md"

[workspace.dependencies]
dotloom-geometry = { path = "crates/geometry", version = "1.1.0" }
dotloom-document = { path = "crates/document", version = "1.1.0" }
dotloom-constraints = { path = "crates/constraints", version = "1.1.0" }
dotloom-scene = { path = "crates/scene", version = "1.1.0" }
dotloom-engine = { path = "crates/engine", version = "1.1.0" }
dotloom-io = { path = "crates/io", version = "1.1.0" }
dotloom-render = { path = "crates/render", version = "1.1.0" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
robust = "1.2.0"
rstar = "0.13.0"
kasuari = "0.4.12"
libm = "0.2.16"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
proptest = "1.11.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
float_cmp = "allow"

# Optimize dependencies (nalgebra, kasuari, ...) in dev/test builds; our crates keep
# full debug info.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 4
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
