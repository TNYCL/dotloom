name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update-visual-baselines:
        description: Write new visual baselines (uploaded as the `visual` artifact for review)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  rust-lint:
    name: rust fmt + clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
      - run: cargo fmt --all -- --check
      - name: Dependency boundaries (core crates have no DOM/window/GPU deps)
        run: node scripts/check-boundaries.mjs
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: clippy (wasm32 bindings)
        run: cargo clippy -p dotloom-wasm -p dotloom-render-web --target wasm32-unknown-unknown --locked -- -D warnings

  rust-test:
    name: rust test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
      - name: Install a software Vulkan driver (Mesa lavapipe) for GPU tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: cargo test --workspace --all-features --locked
        env:
          WGPU_BACKEND: vulkan
      - name: Visual regression against the reviewed lavapipe baselines
        run: cargo test -p dotloom-cli --features png --test visual --locked -- --ignored
        env:
          WGPU_BACKEND: vulkan
          DOTLOOM_VISUAL_UPDATE: ${{ inputs.update-visual-baselines && '1' || '0' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: visual
          path: |
            target/visual
            tests/fixtures/visual
          if-no-files-found: ignore
          retention-days: 14

  dxf-readback:
    name: dxf export read back with ezdxf
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cli
      - run: cargo build --release -p dotloom-cli --locked
      - name: Install ezdxf (independent DXF implementation)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ezdxf==1.4.2
      - name: Import each ezdxf fixture, export it again, read the export with ezdxf
        run: '"$RUNNER_TEMP/venv/bin/python" tests/fixtures/dxf/readback.py target/release/dotloom "$RUNNER_TEMP/dxf"'

  wasm:
    name: wasm build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/build-wasm.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-wasm
          path: packages/sdk/src/wasm
          if-no-files-found: error
          retention-days: 7

  typescript:
    name: typescript lint + test + build
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-wasm
          path: packages/sdk/src/wasm
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check.mjs ts
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: browser e2e (${{ matrix.browser }})
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-wasm
          path: packages/sdk/src/wasm
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install ${{ matrix.browser }}
        working-directory: tests/e2e
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser tests
        working-directory: tests/e2e
        run: xvfb-run -a npx playwright test
        env:
          DOTLOOM_E2E_BROWSERS: ${{ matrix.browser }}
          DOTLOOM_E2E_HEADED: ${{ matrix.browser == 'firefox' && '1' || '0' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            tests/e2e/results
            tests/e2e/test-results
          retention-days: 7

  docs:
    name: docs site build (guide, TypeDoc, rustdoc, playground, examples)
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-wasm
          path: packages/sdk/src/wasm
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: docs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/build-site.mjs --base /dotloom/

  packages:
    name: package consumer (external plugin from tarballs)
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-wasm
          path: packages/sdk/src/wasm
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack, install outside the repository, test and build the external plugin
        run: node scripts/smoke-packages.mjs --keep --work "${{ runner.temp }}/smoke"
      - name: Install Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: Run the external app in a browser
        working-directory: tests/e2e
        run: xvfb-run -a npx playwright test
        env:
          DOTLOOM_E2E_EXTERNAL: ${{ runner.temp }}/smoke/external-plugin/dist
          DOTLOOM_E2E_BROWSERS: chromium
