name: release

# Release from a reviewed tag (vX.Y.Z on main, ci and compat green for that commit):
# clean build, verification, changelog notes, checksums, GitHub Release, then the
# registries when credentials exist. npm, crates.io and GitHub Releases are not
# atomic together: release-manifest.json records what was published where.
# A manual run is a dry run: everything is built and verified, nothing is published.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to build (dry run, nothing is published)
        default: main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE: ${{ github.event_name == 'push' && 'true' || 'false' }}

jobs:
  verify:
    name: verify the commit and versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - id: v
        name: Versions, changelog, main ancestry and required checks
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          sha=$(git rev-parse HEAD)
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("fs"); const v = process.argv[1]; let bad = 0
            const check = (what, got) => { if (got !== v) { console.log(`::error::${what} is ${got}, expected ${v}`); bad++ } }
            check("packages/sdk/package.json", JSON.parse(fs.readFileSync("packages/sdk/package.json")).version)
            check("packages/react/package.json", JSON.parse(fs.readFileSync("packages/react/package.json")).version)
            check("compatibility.json release", JSON.parse(fs.readFileSync("compatibility.json")).release)
            check("packages/sdk/src/version.ts", /SDK_VERSION = .([^"\x27]+)/.exec(fs.readFileSync("packages/sdk/src/version.ts", "utf8"))[1])
            process.exit(bad ? 1 : 0)
          ' "$version"
          if [ "$RELEASE" = true ]; then
            [ "$REF_NAME" = "v$version" ] || { echo "::error::tag $REF_NAME does not match version $version"; exit 1; }
            grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }
            git fetch origin main
            git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
          fi
          for wf in ci compat; do
            c=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf.yml" --commit "$sha" --status success --json conclusion --jq length)
            if [ "$c" = 0 ]; then
              if [ "$RELEASE" = true ]; then echo "::error::no successful $wf run for $sha"; exit 1; fi
              echo "::warning::no successful $wf run for $sha (dry run continues)"
            fi
          done
          echo "Release ${version} from ${sha} (publish: $RELEASE)" >> "$GITHUB_STEP_SUMMARY"

  packages:
    name: build and check packages
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: wasm-bindgen@0.2.129
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-wasm.mjs
      - run: pnpm build
      - name: npm tarballs
        run: |
          mkdir -p dist/npm
          pnpm --filter @dotloom/sdk pack --pack-destination "$PWD/dist/npm"
          pnpm --filter @dotloom/react pack --pack-destination "$PWD/dist/npm"
      - name: Install the tarballs outside the repository, test and build the external plugin
        run: node scripts/smoke-packages.mjs --work "$RUNNER_TEMP/smoke"
      - name: Crates (packaged and verified against each other)
        run: |
          cargo package --workspace --locked --exclude dotloom-wasm --exclude dotloom-render-web
          mkdir -p dist/crates
          cp target/package/*.crate dist/crates/
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || awk '/^## \[Unreleased\]/ {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > dist/notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: dist
          if-no-files-found: error
          retention-days: 14

  cli:
    name: cli (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, exe: dotloom }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, exe: dotloom.exe }
          - { os: macos-15, target: aarch64-apple-darwin, exe: dotloom }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build (with PNG export)
        run: cargo build --release --locked -p dotloom-cli --features png
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          "target/release/$EXE" --version
          mkdir -p dist
          name="dotloom-$VERSION-$TARGET"
          mkdir "$name"
          cp "target/release/$EXE" LICENSE-MIT LICENSE-APACHE README.md "$name/"
          if [ "${RUNNER_OS}" = Windows ]; then 7z a "dist/$name.zip" "$name" > /dev/null; else tar czf "dist/$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-cli-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: GitHub Release
    needs: [verify, packages, cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Checksums and manifest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          mkdir -p out
          cp artifacts/npm/*.tgz artifacts/crates/*.crate artifacts/*.tar.gz artifacts/*.zip out/
          (cd out && sha256sum * > SHA256SUMS)
          cat > out/release-manifest.json <<EOF
          {
            "version": "$VERSION",
            "commit": "$SHA",
            "githubRelease": "$( [ "$RELEASE" = true ] && echo published || echo dry-run )",
            "npm": "pending",
            "crates": "pending",
            "files": $(cd out && ls | grep -v release-manifest.json | jq -R . | jq -s .)
          }
          EOF
          cat out/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Create the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Dotloom $TAG" --notes-file artifacts/notes.md out/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-out
          path: out
          retention-days: 14

  npm:
    name: publish to npm
    needs: [verify, github-release]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: artifacts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish (provenance)
        if: env.HAS_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish artifacts/npm/dotloom-sdk-*.tgz --provenance --access public
          npm publish artifacts/npm/dotloom-react-*.tgz --provenance --access public
      - name: Record the result
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          state=$([ "$HAS_TOKEN" = true ] && echo published || echo "not published: no NPM_TOKEN secret")
          echo "npm: $state" >> "$GITHUB_STEP_SUMMARY"
          echo "npm: $state" > npm-status.txt
          gh release upload "$TAG" npm-status.txt --repo "$GITHUB_REPOSITORY" --clobber

  crates:
    name: publish to crates.io
    needs: [verify, github-release]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Publish the workspace crates in dependency order
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked --exclude dotloom-wasm --exclude dotloom-render-web
      - name: Record the result
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          state=$([ "$HAS_TOKEN" = true ] && echo published || echo "not published: no CARGO_REGISTRY_TOKEN secret")
          echo "crates.io: $state" >> "$GITHUB_STEP_SUMMARY"
          echo "crates.io: $state" > crates-status.txt
          gh release upload "$TAG" crates-status.txt --repo "$GITHUB_REPOSITORY" --clobber
