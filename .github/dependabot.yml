version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (native compiler) is not supported by the docs/build toolchain
      # yet (PR #19 failed type checks, TypeDoc and builds); move deliberately.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node type definitions follow the supported runtime (Node 24), not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  # The external plugin installs @dotloom/* from local tarballs in CI
  # (scripts/smoke-packages.mjs); only its third-party dependencies are updated.
  - package-ecosystem: npm
    directory: /examples/external-plugin
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "@dotloom/*"
