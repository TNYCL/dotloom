[package]
name = "dotloom-render"
description = "wgpu renderer for Dotloom scenes (WebGPU, WebGL2 and native backends)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["cad", "renderer", "wgpu", "2d", "vector"]
categories = ["graphics", "rendering"]

[features]
default = []
## Offscreen rendering to PNG on native backends (used by the CLI and visual tests).
png = ["dep:png", "dep:pollster", "wgpu/dx12", "wgpu/metal", "wgpu/vulkan", "wgpu/gles"]

[dependencies]
dotloom-scene.workspace = true
dotloom-geometry.workspace = true
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl", "std"] }
lyon_tessellation = "1.0.22"
fontdue = "0.9.4"
bytemuck = { version = "1.25.2", features = ["derive"] }
thiserror.workspace = true
serde.workspace = true
png = { version = "0.18.1", optional = true }
pollster = { version = "1.0.1", optional = true }

[lints]
workspace = true
